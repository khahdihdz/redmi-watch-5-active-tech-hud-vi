name: debug-decompile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: windows-2022
    steps:
      - name: Download pinned compiler
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/ooflet/Mi-Create/586a917dec69626447254adc965daabb97fb30dc/src/compiler/compile.exe"
          Invoke-WebRequest -Uri $url -OutFile compile.exe -UseBasicParsing
          (Get-FileHash compile.exe -Algorithm SHA256).Hash

      - name: Install tools
        shell: pwsh
        run: |
          dotnet tool install --global ilspycmd
          python -m pip install --upgrade pip
          python -m pip install sfextract
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Extract bundle
        shell: pwsh
        run: |
          sfextract compile.exe -o extracted 2>&1 | Select-Object -Last 10
          Get-ChildItem extracted -Recurse | Select-Object FullName, Length

      - name: Decompile all assemblies
        shell: pwsh
        run: |
          $i = 0
          Get-ChildItem extracted -Recurse -Filter *.dll | ForEach-Object {
            $i++
            $out = "decompiled\$i"
            Write-Host "== $($_.Name) -> $out"
            ilspycmd -o $out $_.FullName 2>&1 | Select-Object -Last 3
          }

      - name: Upload decompiled source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: decompiled
          path: decompiled/
          if-no-files-found: error
          retention-days: 1
