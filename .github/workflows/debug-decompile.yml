name: debug-decompile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: windows-2022
    steps:
      - name: Download pinned compiler
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/ooflet/Mi-Create/586a917dec69626447254adc965daabb97fb30dc/src/compiler/compile.exe"
          Invoke-WebRequest -Uri $url -OutFile compile.exe -UseBasicParsing
          (Get-FileHash compile.exe -Algorithm SHA256).Hash

      - name: Install tools
        shell: pwsh
        run: |
          dotnet tool install --global ilspycmd
          python -m pip install --upgrade pip
          python -m pip install dnfile
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Extract embedded assemblies
        shell: pwsh
        run: |
          @'
          import pathlib
          import dnfile

          pe = dnfile.dnPE("compile.exe")
          for resource in pe.net.resources:
              name = str(resource.name)
              print("resource:", name, len(resource.data))
              if "XiaomiWatch.Common" in name:
                  pathlib.Path("common.dll").write_bytes(resource.data)
          '@ | Set-Content extract.py
          python extract.py
          Get-Item common.dll | Select-Object Name, Length

      - name: Decompile common assembly
        shell: pwsh
        run: |
          ilspycmd -o decompiled common.dll 2>&1 | Select-Object -Last 5
          Get-ChildItem decompiled | Select-Object Name, Length

      - name: Upload decompiled source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: decompiled
          path: decompiled/
          if-no-files-found: error
          retention-days: 1
