name: build-watchface

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Tạo GitHub Release từ tag đã tồn tại"
        type: boolean
        default: false
      version:
        description: "Tag phiên bản đã tồn tại (bắt buộc khi release=true), ví dụ v1.1.5"
        type: string
        required: false
        default: ""
      channel:
        description: "Kênh phát hành"
        type: choice
        options: [prerelease, stable]
        default: prerelease

permissions:
  contents: read

concurrency:
  group: watchface-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  COMPILER_REPO: ooflet/Mi-Create
  COMPILER_COMMIT: 586a917dec69626447254adc965daabb97fb30dc
  COMPILER_SHA256: bf0f7230f4fd08ed45d9a9fd1b8359a679b04b87998825a259e0ef49ba239f30
  ARTIFACT: redmi-watch-5-active-tech-hud-vi

jobs:
  source:
    name: Source, preview, tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=v1.1.5-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Install pinned dependencies
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Generate assets and fprj
        shell: bash
        run: .venv/bin/python scripts/generate_assets.py

      - name: Validate target contract
        shell: bash
        run: .venv/bin/python scripts/validate_target.py

      - name: Validate bitmaps, Vietnamese glyphs and fprj
        shell: bash
        run: .venv/bin/python scripts/validate_assets.py

      - name: Unit tests
        shell: bash
        run: .venv/bin/python -m pytest -q

      - name: Package preview + source (no binary)
        shell: bash
        run: .venv/bin/python scripts/package_release.py --version "${VERSION}"

      - name: Assert source job did not fabricate a binary
        shell: bash
        run: |
          if [ -e dist/tech-hud-vi.bin ]; then
            echo "FAIL: source job produced a .bin without running the compiler" >&2
            exit 1
          fi

      - name: Upload source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tech-hud-vi-source
          path: dist/
          if-no-files-found: error
          retention-days: 14

  compiler:
    name: Compile real .bin (Windows)
    needs: source
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: tech-hud-vi-source
          path: dist

      - name: Extract released source archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem .\dist\*.zip | Select-Object -First 1
          if (-not $zip) { throw "Không tìm thấy source zip trong artifact" }
          Expand-Archive -Path $zip.FullName -DestinationPath .\build -Force
          $root = Get-ChildItem .\build -Directory | Select-Object -First 1
          if (-not $root) { throw "Source zip không có thư mục gốc" }
          if (-not (Test-Path (Join-Path $root.FullName "src\watchface\tech_hud_vi.fprj"))) {
            throw "Source zip thiếu src/watchface/tech_hud_vi.fprj"
          }
          "SOURCE_ROOT=$($root.FullName)" >> $env:GITHUB_ENV
          Write-Host "SOURCE_ROOT=$($root.FullName)"

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:SOURCE_ROOT\requirements.txt"

      - name: Validate target contract from released source
        shell: pwsh
        run: |
          python "$env:SOURCE_ROOT\scripts\validate_target.py"
          if ($LASTEXITCODE -ne 0) { throw "validate_target.py failed" }

      - name: Download pinned compiler and verify SHA-256
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/$env:COMPILER_REPO/$env:COMPILER_COMMIT/src/compiler/compile.exe"
          Invoke-WebRequest -Uri $url -OutFile compile.exe -UseBasicParsing
          $hash = (Get-FileHash compile.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:COMPILER_SHA256) {
            throw "Compiler SHA-256 mismatch: $hash"
          }
          Write-Host "Compiler SHA-256 OK: $hash"

      - name: Compile watch face from released source
        shell: pwsh
        env:
          WATCHFACE_BUILD_DIR: ${{ github.workspace }}\build-tmp
        run: |
          python "$env:SOURCE_ROOT\scripts\build_watchface.py" --no-generate --compiler "$env:GITHUB_WORKSPACE\compile.exe"
          if ($LASTEXITCODE -ne 0) { throw "build_watchface.py failed with exit code $LASTEXITCODE" }
          $bin = Join-Path $env:SOURCE_ROOT "dist\tech-hud-vi.bin"
          if (-not (Test-Path $bin)) { throw "Không có dist/tech-hud-vi.bin sau khi biên dịch" }
          Copy-Item $bin .\tech-hud-vi.bin -Force
          Get-FileHash .\tech-hud-vi.bin -Algorithm SHA256 | Format-List

      - name: Upload compiled binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tech-hud-vi-bin
          path: tech-hud-vi.bin
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [source, compiler]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Download source artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: tech-hud-vi-source
          path: dist

      - name: Download compiled binary
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: tech-hud-vi-bin
          path: dist

      - name: Install pinned dependencies
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Resolve tag and channel
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_VERSION}"
            CHANNEL="${INPUT_CHANNEL}"
          else
            TAG="${GITHUB_REF_NAME}"
            CHANNEL="auto"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "FAIL: tag không hợp lệ: ${TAG}" >&2
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "CHANNEL=${CHANNEL}" >> "$GITHUB_ENV"

      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "FAIL: release ${TAG} đã tồn tại; không ghi đè." >&2
            exit 1
          fi
          echo "OK: chưa có release ${TAG}"

      - name: Verify compiled binary
        shell: bash
        run: |
          .venv/bin/python scripts/verify_binary.py dist/tech-hud-vi.bin \
            --expect-title "Tech HUD VI" --json-out dist/verification.json

      - name: Package release files and checksums
        shell: bash
        run: |
          .venv/bin/python scripts/package_release.py \
            --version "${TAG}" --require-bin --channel "${CHANNEL}"

      - name: Verify SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERIFIED="$(.venv/bin/python -c "import json;print('true' if json.load(open('tests/device_verification.json'))['verified'] else 'false')")"
          FLAGS=()
          if [[ "${CHANNEL}" == "prerelease" || "${VERIFIED}" != "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${TAG}" \
            "dist/tech-hud-vi.bin" \
            "dist/${ARTIFACT}-preview.png" \
            "dist/${ARTIFACT}-source.zip" \
            "dist/SHA256SUMS.txt" \
            "dist/BUILD-INFO.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Redmi Watch 5 Active Tech HUD VI: Brass ${TAG}" \
            --notes-file dist/release-notes.md \
            "${FLAGS[@]}"

      - name: Verify uploaded release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          for FILE in tech-hud-vi.bin "${ARTIFACT}-preview.png" "${ARTIFACT}-source.zip" SHA256SUMS.txt BUILD-INFO.txt; do
            if ! grep -Fxq "${FILE}" <<< "${ASSETS}"; then
              echo "FAIL: thiếu asset ${FILE}" >&2
              exit 1
            fi
          done
          echo "OK: release ${TAG} có đủ 5 asset"
